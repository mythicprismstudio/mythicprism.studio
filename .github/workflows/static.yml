<script>
function sp(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');document.getElementById('nb-'+n).classList.add('active');window.scrollTo(0,0);n==='home'?ssFX():stopFX();}
const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
let W=0,H=0,figs=[],T=0;
const pal=[[201,168,76],[184,150,90],[154,122,58],[106,80,32],[139,38,32],[232,201,122]];
const rv=(a,b)=>a+(b-a)*Math.random();
function pE(cx,cy,rx,ry,n,s){const p=[];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.sqrt(Math.random());p.push({x:cx+rx*v*Math.cos(a)+rv(-s,s),y:cy+ry*v*Math.sin(a)+rv(-s,s)});}return p;}
function pL(x1,y1,x2,y2,n,s){const p=[];for(let i=0;i<n;i++){const t=Math.random();p.push({x:x1+(x2-x1)*t+rv(-s,s),y:y1+(y2-y1)*t+rv(-s,s)});}return p;}
function pA(cx,cy,r,a0,a1,n,s){const p=[];for(let i=0;i<n;i++){const a=a0+(a1-a0)*Math.random();p.push({x:cx+r*Math.cos(a)+rv(-s,s),y:cy+r*Math.sin(a)+rv(-s,s)});}return p;}
function pB(x0,y0,cx1,cy1,cx2,cy2,x1,y1,n,s){const p=[];for(let i=0;i<n;i++){const t=Math.random(),m=1-t;p.push({x:m*m*m*x0+3*m*m*t*cx1+3*m*t*t*cx2+t*t*t*x1+rv(-s,s),y:m*m*m*y0+3*m*m*t*cy1+3*m*t*t*cy2+t*t*t*y1+rv(-s,s)});}return p;}
const BD=[(S)=>{const p=[];p.push(...pE(S.x,S.y,S.w*.45,S.h*.3,200,S.w*.02));p.push(...pA(S.x,S.y,S.w*.18,0,Math.PI*2,120,S.w*.01));for(let i=0;i<8;i++){const a=i*Math.PI/4;p.push(...pL(S.x+S.w*.2*Math.cos(a),S.y+S.h*.14*Math.sin(a),S.x+S.w*.42*Math.cos(a),S.y+S.h*.28*Math.sin(a),20,S.w*.01));}return p;},
(S)=>{const p=[];p.push(...pE(S.x,S.y-S.h*.1,S.w*.38,S.h*.38,300,S.w*.02));p.push(...pE(S.x-S.w*.12,S.y-.05*S.h,S.w*.1,S.h*.12,60,S.w*.01));p.push(...pE(S.x+S.w*.12,S.y-.05*S.h,S.w*.1,S.h*.12,60,S.w*.01));p.push(...pL(S.x-S.w*.12,S.y+S.h*.15,S.x+S.w*.12,S.y+S.h*.15,40,S.w*.01));return p;},
(S)=>{const p=[];p.push(...pB(S.x,S.y,S.x-S.w*.5,S.y-S.h*.5,S.x-S.w*.8,S.y+S.h*.2,S.x-S.w*.3,S.y+S.h*.4,150,S.w*.02));p.push(...pB(S.x,S.y,S.x+S.w*.5,S.y-S.h*.5,S.x+S.w*.8,S.y+S.h*.2,S.x+S.w*.3,S.y+S.h*.4,150,S.w*.02));p.push(...pE(S.x,S.y,S.w*.12,S.h*.18,80,S.w*.01));return p;},
(S)=>{const p=[];const r1=S.w*.42;for(let i=0;i<5;i++){const a=i*Math.PI*.4-Math.PI*.5,b=((i+2)%5)*Math.PI*.4-Math.PI*.5;p.push(...pL(S.x+r1*Math.cos(a),S.y+r1*Math.sin(a),S.x+r1*Math.cos(b),S.y+r1*Math.sin(b),40,S.w*.01));}p.push(...pA(S.x,S.y,r1,0,Math.PI*2,100,S.w*.01));return p;},
(S)=>{const p=[];p.push(...pB(S.x-S.w*.4,S.y,S.x-S.w*.4,S.y-S.h*.6,S.x,S.y-S.h*.6,S.x,S.y-S.h*.3,120,S.w*.02));p.push(...pB(S.x+S.w*.4,S.y,S.x+S.w*.4,S.y-S.h*.6,S.x,S.y-S.h*.6,S.x,S.y-S.h*.3,120,S.w*.02));p.push(...pE(S.x,S.y-S.h*.1,S.w*.35,S.h*.35,200,S.w*.02));return p;},
(S)=>{const p=[];p.push(...pA(S.x,S.y,S.w*.38,0,Math.PI*2,300,S.w*.03));p.push(...pE(S.x,S.y-S.h*.38,S.w*.09,S.h*.07,40,S.w*.01));return p;}];
class GF{constructor(){this.reset(true);}reset(i=false){this.x=rv(W*.05,W*.95);this.y=i?rv(0,H):rv(H*.1,H*.9);this.w=rv(W*.08,W*.18);this.h=this.w*rv(.9,1.3);this.b=BD[Math.floor(Math.random()*BD.length)];this.pts=this.b({x:0,y:0,w:this.w,h:this.h});this.col=pal[Math.floor(Math.random()*pal.length)];this.ba=rv(.018,.046);this.ph=Math.random()*Math.PI*2;this.sp=rv(.004,.012);this.rot=rv(-Math.PI,Math.PI);this.rs=rv(-.0008,.0008);this.life=0;this.ml=rv(400,900);this.dx=rv(-.08,.08);this.dy=rv(-.04,.04);}draw(ctx,t){this.life++;if(this.life>this.ml){this.reset();return;}const fd=Math.min(this.life/80,1)*Math.min((this.ml-this.life)/80,1);const br=.7+.3*Math.sin(t*this.sp+this.ph);this.x+=this.dx;this.y+=this.dy;this.rot+=this.rs;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);const[r2,g,b]=this.col;for(const pt of this.pts){ctx.globalAlpha=this.ba*fd*br*(.5+Math.random()*.5);ctx.fillStyle=`rgb(${r2},${g},${b})`;ctx.beginPath();ctx.arc(pt.x+rv(-1.5,1.5),pt.y+rv(-1.5,1.5),rv(.8,2.2),0,Math.PI*2);ctx.fill();}ctx.restore();}}
function rsz(){bgC.width=W=window.innerWidth;bgC.height=H=window.innerHeight;figs=[];for(let i=0;i<12;i++)figs.push(new GF());}
function bgL(){bgX.clearRect(0,0,W,H);T++;figs.forEach(f=>f.draw(bgX,T));requestAnimationFrame(bgL);}
window.addEventListener('resize',rsz);rsz();bgL();
const sC=document.getElementById('sc'),sX=sC.getContext('2d');
let sps=[],srun=false,said=null;
function rsc2(){sC.width=window.innerWidth;sC.height=window.innerHeight;}
window.addEventListener('resize',rsc2);rsc2();
class SP{constructor(){this.reset();}reset(){this.x=Math.random()*sC.width;this.y=-10;this.vx=rv(-.5,.5);this.vy=rv(1.5,3.5);this.sz=rv(2,4);this.a=rv(.4,.8);this.sand=true;this.m=0;}update(){const fl=sC.height*.85;if(this.sand){this.x+=this.vx;this.y+=this.vy;this.vy+=.04;if(this.y>=fl){this.y=fl;this.vy*=-.1;this.sand=false;this.m=0;}}else{this.m+=.04;if(this.m>1)this.a-=.015;if(this.a<=0)this.reset();}}draw(c){c.save();c.globalAlpha=this.a;if(this.sand){c.fillStyle='#c9a84c';c.beginPath();c.arc(this.x,this.y,this.sz,0,Math.PI*2);c.fill();}else{const s=this.sz*(1+Math.min(this.m,1)*.8);c.strokeStyle='#c9a84c';c.lineWidth=.8;c.beginPath();c.arc(this.x,this.y-s*.1,s,0,Math.PI*2);c.stroke();c.fillStyle='#080604';c.beginPath();c.ellipse(this.x-s*.35,this.y+s*.05,s*.2,s*.25,0,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(this.x+s*.35,this.y+s*.05,s*.2,s*.25,0,0,Math.PI*2);c.fill();c.strokeStyle='#9a7a3a';c.beginPath();c.moveTo(this.x-s*.3,this.y+s*.5);for(let i=0;i<4;i++)c.lineTo(this.x-s*.3+i*s*.2,this.y+s*(i%2===0?.35:.5));c.lineTo(this.x+s*.3,this.y+s*.5);c.stroke();}c.restore();}}
function skL(){sX.clearRect(0,0,sC.width,sC.height);if(Math.random()<.3)sps.push(new SP());if(sps.length>220)sps.splice(0,20);sps.forEach(p=>{p.update();p.draw(sX);});said=requestAnimationFrame(skL);}
function ssFX(){sC.style.opacity='1';if(!srun){srun=true;skL();}}
function stopFX(){sC.style.opacity='0';if(said){cancelAnimationFrame(said);said=null;srun=false;}sps=[];}
ssFX();
</script>
</body></html>

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
