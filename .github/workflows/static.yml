# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYTHIC PRISM STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--s0:#fdf6e8;--s1:#f0ddb8;--s2:#e8c97a;--s3:#d4b483;--s4:#c9a84c;--s5:#b8965a;--s6:#9a7a3a;--s7:#6a5020;--ink:#080604;--ink2:#0f0c06;--ink3:#181008;--ink4:#221808;--red:#6b1a1a;--red2:#8b2020;}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100vh;background:var(--ink);color:var(--s1);font-family:'Courier Prime',monospace;overflow-x:hidden}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#sc{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s}
.page{position:relative;z-index:2;min-height:100vh;display:none}.page.active{display:block}
nav{position:fixed;top:0;left:0;width:100%;z-index:100;background:var(--ink);border-bottom:2px solid var(--s7);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
.nl{font-family:'UnifrakturMaguntia',serif;font-size:22px;color:var(--s2);letter-spacing:2px;cursor:pointer}
.nbs{display:flex}.nb{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;color:var(--s5);background:none;border:none;border-left:1px solid var(--s7);padding:0 20px;height:56px;cursor:pointer;text-transform:uppercase;transition:all .2s}
.nb:hover,.nb.active{color:var(--s2);background:var(--ink3)}
@keyframes shi{0%{background-position:200% center}100%{background-position:-200% center}}
.sh{background:linear-gradient(90deg,var(--s6),var(--s2),var(--s4),var(--s1),var(--s4),var(--s2),var(--s6));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shi 6s linear infinite}
@keyframes gp{0%,100%{opacity:.7}50%{opacity:1;filter:brightness(1.5)}}
.hw{padding-top:56px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.hh{width:100%;max-width:1100px;padding:60px 24px 40px;text-align:center}
.ey{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:6px;color:var(--s6);text-transform:uppercase;margin-bottom:16px}
.ht{font-family:'UnifrakturMaguntia',serif;font-size:clamp(52px,10vw,110px);line-height:.9;color:var(--s2);margin-bottom:8px}
.hs{font-family:'Bebas Neue',cursive;font-size:clamp(18px,4vw,36px);letter-spacing:8px;color:var(--s5);margin-bottom:32px}
.hr{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--s4),transparent);margin:0 auto 32px}
.hd{max-width:560px;margin:0 auto 48px;font-size:14px;line-height:1.8;color:var(--s3);letter-spacing:.5px}
.ss{width:100%;max-width:860px;padding:0 24px 60px}
.sl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:5px;color:var(--s6);text-transform:uppercase;margin-bottom:20px;text-align:center;border-top:1px solid var(--s7);padding-top:20px}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.sb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 12px;border:1px solid var(--s7);background:var(--ink2);color:var(--s3);text-decoration:none;font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:3px;transition:all .25s;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(201,168,76,.06));pointer-events:none}
.sb:hover{border-color:var(--s4);color:var(--s2);background:var(--ink3)}
.si{font-size:28px;margin-bottom:8px;animation:gp 3s ease-in-out infinite}.su{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:3px;color:var(--s6);margin-top:6px}
.gp2{padding-top:56px;min-height:100vh}.gh{padding:40px 24px 30px;border-bottom:2px solid var(--s7);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.gn{font-family:'Bebas Neue',cursive;font-size:80px;line-height:1;color:var(--s7)}.gt{font-family:'UnifrakturMaguntia',serif;font-size:36px;color:var(--s2)}
.gs{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:4px;color:var(--s6);text-transform:uppercase;margin-left:auto}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;padding:2px}
.gc{background:var(--ink2);border:1px solid var(--s7);overflow:hidden;cursor:pointer;transition:border-color .2s;display:flex;flex-direction:column}.gc:hover{border-color:var(--s4)}
.gi{width:100%;aspect-ratio:4/5;background:var(--ink3);overflow:hidden;display:flex;align-items:center;justify-content:center}.gi svg{width:100%;height:100%}
.gii{padding:14px 16px;border-top:1px solid var(--s7)}.gnum{font-family:'Bebas Neue',cursive;font-size:28px;color:var(--s7);line-height:1}
.gtt{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2px;color:var(--s2);text-transform:uppercase;margin-top:2px}
.gd{font-size:10px;color:var(--s6);letter-spacing:1px;margin-top:4px;font-family:'Oswald',sans-serif}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;padding:2px}
.mc{background:var(--ink2);border:1px solid var(--s7);overflow:hidden;transition:border-color .2s}.mc:hover{border-color:var(--s4)}
.mi{width:100%;aspect-ratio:1;background:var(--ink3);overflow:hidden;display:flex;align-items:center;justify-content:center}.mi svg{width:100%;height:100%}
.mii{padding:10px 12px;border-top:1px solid var(--s7)}.mt{font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:2px;color:var(--s3)}
.str{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;border-top:2px solid var(--s7);margin-top:2px}
.stl{display:flex;flex-direction:column;align-items:center;padding:18px 8px;border:1px solid var(--s7);background:var(--ink2);text-decoration:none;transition:border-color .2s}.stl:hover{border-color:var(--s4)}
.std{width:34px;height:34px;border-radius:50%;margin-bottom:8px}.stn{font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:2px;color:var(--s5)}.sts{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;color:var(--s7);margin-top:3px}
.rb{width:100%;text-align:center;padding:12px 0;font-size:18px;color:var(--s7);letter-spacing:8px;border-top:1px solid var(--s7)}
</style>
</head>
